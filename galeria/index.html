const grid = document.getElementById('grid');
const lb = document.getElementById('lb');
const lbimg = document.getElementById('lbimg');
const baixar = document.getElementById('baixar');
let atual = 0;
fotos.forEach((f, i) => {
  const im = new Image();
  im.loading = 'lazy';
  im.src = f.thumb;
  im.alt = f.nome;
  im.onclick = () => abrir(i);
  grid.appendChild(im);
});
function abrir(i) {
  atual = (i + fotos.length) % fotos.length;
  lbimg.src = fotos[atual].thumb;
  baixar.href = fotos[atual].original || '#';
  baixar.target = '_blank';
  baixar.rel = 'noopener';
  baixar.style.display = fotos[atual].original ? '' : 'none';
  document.getElementById('cont').textContent = (atual + 1) + ' / ' + fotos.length;
  lb.classList.add('on');
}
function fechar() { lb.classList.remove('on'); }
document.getElementById('ant').onclick = () => abrir(atual - 1);
document.getElementById('prox').onclick = () => abrir(atual + 1);
document.getElementById('fechar').onclick = fechar;
lb.onclick = e => { if (e.target === lb) fechar(); };
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'ArrowLeft') abrir(atual - 1);
  if (e.key === 'ArrowRight') abrir(atual + 1);
  if (e.key === 'Escape') fechar();
});
</script></body></html>
